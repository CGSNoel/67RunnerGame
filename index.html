<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The official website for 67Runner by Papanoël Games.">
    <title>67Runner - Official Site</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <header class="site-header">
        <a href="./" class="site-logo">67Runner</a>
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="./" aria-current="page">Home</a>
            <a href="privacy/">Privacy Policy</a>
            <a href="terms/">Terms of Service</a>
            <a href="contact/">Contact</a>
        </nav>
    </header>

    <main class="site-main">
        <section class="hero" aria-labelledby="home-title">
            <img src="67runner_icon.png" alt="67Runner game icon" class="app-icon" onerror="this.style.display='none';">

            <h1 id="home-title">67Runner</h1>
            <p>An epic mobile gaming adventure. Download now on your favorite app store!</p>

            <!-- Replace these placeholder URLs when the store listings are published. -->
            <div class="badge-container" aria-label="Download links">
                <a class="store-badge" href="YOUR_APPLE_APP_STORE_URL_HERE" target="_blank" rel="noopener noreferrer">
                    <span class="store-badge-kicker">Download on the</span>
                    <span class="store-badge-name">App Store</span>
                </a>
                <a class="store-badge" href="YOUR_GOOGLE_PLAY_STORE_URL_HERE" target="_blank" rel="noopener noreferrer">
                    <span class="store-badge-kicker">Get it on</span>
                    <span class="store-badge-name">Google Play</span>
                </a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Papanoël Games. Built with GitHub Pages.</p>
        <nav class="footer-links" aria-label="Legal navigation">
            <a href="privacy/">Privacy Policy</a>
            <a href="terms/">Terms of Service</a>
            <a href="contact/">Contact &amp; Support</a>
        </nav>
    </footer>
</body>
</html>
